<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{event.name} · Doorman</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="manifest" href="/s/{event.scanCode}/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="scanner-body">
<div id="scanner" class="choose">
  <a href="/help#scannen" class="help-btn dark corner" title="Hilfe" aria-label="Hilfe">?</a>
  <div class="choose-head">
    {#if event.eventDate}<div class="scan-event">{event.eventDate.de}</div>{/if}
    <h1>{event.name}</h1>
    <p class="scan-event">Check-in-Punkt wählen</p>
  </div>
  <div class="scan-buttons">
    {#for cp in checkpoints}
    <a class="btn primary big" href="/s/{event.scanCode}/{cp.id}">📷 {cp.name}</a>
    {/for}
  </div>
  <div class="scan-foot">
    Angemeldet als {inject:ctx.username} · <a href="/logout">Abmelden</a>
    {#if inject:ctx.admin} · <a href="/events/{event.id}">Verwaltung</a>{/if}
  </div>
</div>
</body>
</html>

quarkus.application.name=doorman
quarkus.default-locale=de

# ---------- Datenbank ----------
# Lokal (dev/test) startet Quarkus automatisch einen PostgreSQL-Container (Dev Services, Podman/Docker).
# In Produktion über Umgebungsvariablen: DB_URL, DB_USER, DB_PASSWORD
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# ---------- Login (Formular, Benutzer in der DB) ----------
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login?error=true
quarkus.http.auth.form.landing-page=/
# Angemeldet bleiben: 12 h ohne Aktivität (Scanner am Veranstaltungstag)
quarkus.http.auth.form.timeout=PT12H
quarkus.http.auth.form.http-only-cookie=true
quarkus.http.auth.form.cookie-same-site=lax
# Schlüssel zum Verschlüsseln des Login-Cookies (mind. 16 Zeichen). In Produktion als Secret setzen:
# SESSION_ENCRYPTION_KEY. Ändert er sich, müssen sich alle neu anmelden.
%prod.quarkus.http.auth.session.encryption-key=${SESSION_ENCRYPTION_KEY}
%dev.quarkus.http.auth.session.encryption-key=dev-only-session-key-0123456789
%test.quarkus.http.auth.session.encryption-key=test-only-session-key-0123456789

quarkus.http.auth.permission.public.paths=/login,/help,/j_security_check,/css/*,/js/*,/vendor/*,/icons/*,/manifest.webmanifest,/q/health/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.app.paths=/*
quarkus.http.auth.permission.app.policy=authenticated

# Passwort für den Benutzer "admin" beim allerersten Start (ohne Angabe wird eines erzeugt und geloggt)
doorman.initial-admin-password=${INITIAL_ADMIN_PASSWORD:}
%dev.doorman.initial-admin-password=admin
%test.doorman.initial-admin-password=admin

# ---------- Betrieb hinter OpenShift-Route ----------
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true
quarkus.http.limits.max-form-attribute-size=4M
quarkus.http.limits.max-body-size=5M


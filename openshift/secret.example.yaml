# Kopieren nach secret.yaml, Werte eintragen, NICHT einchecken:
#   oc apply -f openshift/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: doorman
type: Opaque
stringData:
  DB_URL: jdbc:postgresql://<host>:5432/doorman
  DB_USER: doorman
  DB_PASSWORD: <passwort>
  # mind. 16 zufällige Zeichen, z. B.: openssl rand -base64 32
  SESSION_ENCRYPTION_KEY: <zufallswert>
  # Passwort für "admin" beim allerersten Start (danach in der App ändern)
  INITIAL_ADMIN_PASSWORD: <startpasswort>
